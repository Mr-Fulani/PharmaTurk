name: mudaroba

# Память сервера (7,7 ГБ) поделена жёсткими mem_limit так, чтобы их сумма
# (7 ГиБ) оставляла место системе: контейнер, вышедший за лимит, получает
# OOM внутри себя, а не вешает весь хост. Расчёт — docs/PROD_MEMORY.md.
services:
  postgres:
    image: postgres:15.18-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmaturk}
      POSTGRES_USER: ${POSTGRES_USER:-pharmaturk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmaturk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    mem_limit: 640m
    networks: [data]

  # Брокер и результаты Celery. Ключи очередей без TTL: вытеснять их нельзя,
  # поэтому noeviction — при лимите Redis отказывает в записи, но ничего не
  # теряет. RDB-снимки (настройки save по умолчанию) сохраняют очереди при
  # пересоздании контейнера. mem_limit вдвое больше maxmemory — запас на fork
  # при BGSAVE.
  redis:
    image: redis:7.4.10-alpine3.21
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    mem_limit: 192m
    networks: [data]

  # Кэш Django: только в памяти, старые ключи вытесняются сами (allkeys-lru),
  # при рестарте просто пустеет.
  redis-cache:
    image: redis:7.4.10-alpine3.21
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    networks: [data]

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    mem_limit: 384m
    networks: [data]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEPENDENCY_LOCK_HASH: ${DEPENDENCY_LOCK_HASH:-unknown}
        VCS_REF: ${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    image: mudaroba-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_SEED_CATALOG: ${RUN_SEED_CATALOG:-0}
      REGISTER_TELEGRAM_WEBHOOK_ON_START: ${REGISTER_TELEGRAM_WEBHOOK_ON_START:-0}
    volumes:
      - staticfiles:/app/staticfiles
      - huggingface_cache:/home/app/.cache/huggingface
    entrypoint: ["bash", "/app/docker-entrypoint.sh"]
    mem_limit: 2g
    networks: [edge, data]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VCS_REF=${IMAGE_TAG:-local}
        - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_VK_APP_ID=${NEXT_PUBLIC_VK_APP_ID:-}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
        - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID:-}
        - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID:-}
        - NEXT_PUBLIC_YM_ID=${NEXT_PUBLIC_YM_ID:-}
    image: mudaroba-frontend:${IMAGE_TAG:-local}
    working_dir: /app
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - INTERNAL_API_BASE=http://backend:8000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
      - SITE_URL=${SITE_URL:-}
      - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_VK_APP_ID=${NEXT_PUBLIC_VK_APP_ID:-}
      - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID:-}
      - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID:-}
      - NEXT_PUBLIC_YM_ID=${NEXT_PUBLIC_YM_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]

  celeryworker:
    image: mudaroba-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    # --max-memory-per-child (КиБ): процесс, разросшийся после задачи (Pillow,
    # большие ответы поставщиков), заменяется свежим вместо роста до OOM.
    command: bash -c "poetry run celery -A config worker -Q celery --loglevel=info --concurrency=2 --max-memory-per-child=400000"
    mem_limit: 640m
    networks: [data, egress]

  celery_ai:
    image: mudaroba-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    command: bash -c "poetry run celery -A config worker -Q ai -n ai_worker@%h --loglevel=info --concurrency=2 --max-memory-per-child=400000"
    mem_limit: 512m
    networks: [data, egress]

  celery_recsys:
    image: mudaroba-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    command: bash -c "poetry run celery -A config worker -Q recsys_search,recsys -n recsys_worker@%h --loglevel=info --concurrency=1 --disable-prefetch"
    volumes:
      - huggingface_cache:/home/app/.cache/huggingface
    # Модели CLIP + MiniLM держатся в памяти процесса (≈ 1,3 ГБ), поэтому
    # concurrency=1 и без перезапуска процесса после задачи. Здесь же кодируется
    # картинка поиска по фото (очередь recsys_search): веб CLIP не грузит.
    # --disable-prefetch: следующая задача берётся из Redis только при свободном
    # слоте, иначе поиск ждал бы ещё и заранее взятый батч индексации.
    mem_limit: 1.5g
    networks: [data, egress]

  celerybeat:
    image: mudaroba-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
    env_file:
      - .env
    environment:
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    command: bash -c "poetry run celery -A config beat --loglevel=info"
    mem_limit: 384m
    networks: [data]

  # One-shot schema operation used by release tooling. It never starts during a
  # regular compose up because it is behind the explicit ops profile.
  migrate:
    image: mudaroba-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-local}}
    profiles: [ops]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-cache:
        condition: service_started
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    entrypoint: ["poetry", "run", "python", "manage.py"]
    command: ["migrate", "--noinput"]
    networks: [data]

  nginx:
    image: nginx:1.30.4-alpine3.24
    depends_on:
      - frontend
      - backend
    mem_limit: 128m
    networks: [edge]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  staticfiles:
  huggingface_cache:

networks:
  edge:
  egress:
  data:
    internal: true
