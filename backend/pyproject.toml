[tool.poetry]
name = "pharmaturk-backend"
version = "0.1.0"
description = "MVP бэкенд Mudaroba на Django/DRF с Celery, Redis, PostgreSQL, Swagger, JWT"
authors = ["Mudaroba Team <dev@mudaroba.example>"]
readme = "README.md"
packages = [{ include = "config" }, { include = "api" }, { include = "apps" }]

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.2.17"
sqlparse = ">=0.6.0,<0.7.0"
djangorestframework = "^3.15.2"
drf-spectacular = "^0.27.2"
djangorestframework-simplejwt = "^5.3.1"
psycopg2-binary = "^2.9.9"
celery = "^5.3.6"
redis = "^5.0.4"
django-environ = "^0.11.2"
django-cors-headers = "^4.4.0"
whitenoise = "^6.6.0"
gunicorn = "^22.0.0"
django-prometheus = "^2.3.1"
sentry-sdk = {version = "^2.9.0", extras = ["django"]}
python-json-logger = "^2.0.7"
httpx = "^0.27.0"
Pillow = "^12.3.0"
boto3 = "^1.35.33"
imagehash = "^4.3.1"
python-telegram-bot = "^21.6"
django-storages = {version = "^1.14.4", extras = ["s3"]}
beautifulsoup4 = "^4.12.3"
lxml = "^6.1.1"
fake-useragent = "^1.5.1"
selenium = "^4.21.0"
instaloader = "^4.13"
transliterate = "^1.10.2"
openai = "^2.16.0"
qdrant-client = "^1.16.2"
numpy = ">=1.26.0,<3"
torch = [
    { version = "2.13.0", markers = "sys_platform == 'darwin'" },
    { version = "2.13.0+cpu", source = "pytorch-cpu", markers = "sys_platform != 'darwin'" },
]
transformers = "^5.14.1"
sentence-transformers = "^5.7.0"
requests = "^2.31.0"
weasyprint = "^68.1"
ikea-api = ">=2.4.0"
django-nested-admin = "^4.1.6"
curl-cffi = "^0.16.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-django = "^4.8.0"
black = "^26.3.1"
isort = "^5.13.2"
flake8 = "^7.1.1"
pytest-cov = "^7.1.0"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
