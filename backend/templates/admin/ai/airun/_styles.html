<style>
  .airun-card { background: var(--body-bg); border: 1px solid var(--hairline-color); border-radius: 8px; padding: 16px 20px; margin: 0 0 16px; max-width: 900px; }
  .airun-card h2 { margin-top: 0; font-size: 16px; color: var(--body-fg); background: none; padding: 0; text-transform: none; letter-spacing: 0; }
  .airun-note { background: var(--darkened-bg); color: var(--body-fg); padding: 12px 16px; border-radius: 6px; margin: 0 0 16px; max-width: 900px; line-height: 1.5; }
  .airun-warn { background: #fef3c7; color: #78350f; padding: 12px 16px; border-radius: 6px; margin: 0 0 16px; max-width: 900px; line-height: 1.5; }
  .airun-error { background: #fee2e2; color: #7f1d1d; padding: 12px 16px; border-radius: 6px; margin: 0 0 16px; max-width: 900px; line-height: 1.5; }
  .airun-ok { background: #dcfce7; color: #14532d; padding: 12px 16px; border-radius: 6px; margin: 0 0 16px; max-width: 900px; line-height: 1.5; }
  .airun-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
  .airun-buttons .button, .airun-buttons input[type=submit] { padding: 10px 18px; font-size: 14px; }
  .airun-big { background: var(--button-bg); color: var(--button-fg) !important; border-radius: 4px; padding: 10px 18px; font-size: 14px; border: 0; cursor: pointer; }
  .airun-danger { background: #b91c1c !important; color: #fff !important; }
  .airun-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .airun-stat { background: var(--darkened-bg); border-radius: 6px; padding: 10px 12px; }
  .airun-stat b { display: block; font-size: 22px; color: var(--body-fg); }
  .airun-stat small { display: block; color: var(--body-quiet-color); font-size: 12px; }
  .airun-bar { height: 14px; background: var(--darkened-bg); border-radius: 7px; overflow: hidden; margin: 8px 0; }
  .airun-bar div { height: 100%; background: #16a34a; transition: width .5s; }
  .airun-form .form-row { padding: 10px 0; border-bottom: 1px solid var(--hairline-color); }
  .airun-form label { font-weight: 600; display: block; margin-bottom: 4px; color: var(--body-fg); }
  .airun-form label.inline { display: inline; font-weight: 600; }
  .airun-form .help { color: var(--body-quiet-color); font-size: 12px; margin-top: 4px; }
  .airun-lines { font-family: monospace; font-size: 12px; max-height: 360px; overflow: auto; background: var(--darkened-bg); padding: 10px; border-radius: 6px; white-space: pre-wrap; }
</style>
