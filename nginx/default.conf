# Кэш ответов proxy-media (ресайзы карточек): снимает повторную нагрузку с Django
proxy_cache_path /var/cache/nginx/proxy_media levels=1:2 keys_zone=proxy_media:10m
                 max_size=1g inactive=30d use_temp_path=off;

# Docker assigns a new IP when a service container is recreated. Without
# runtime DNS resolution nginx keeps the IP resolved at startup and returns
# 502 until it is restarted manually.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
server_tokens off;
include /etc/nginx/cloudflare-realip.inc;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8000 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
}

# Бэкенд отдаёт webp в зависимости от Accept — учитываем в ключе кэша,
# не фрагментируя его полным значением заголовка
map $http_accept $accept_webp {
    default      "";
    "~image/webp" "webp";
}

# Кэшируем только картинки (расширение в ?path=). Видео — пасс-тру:
# его стримят Range-запросами, в кэше оно лишь вымывало бы картинки.
map $arg_path $proxy_media_skip_cache {
    default 1;
    "~*\.(jpe?g|png|webp|gif|svg|ico|avif)$" 0;
}

# Cloudflare and other trusted edge proxies preserve the browser scheme in
# X-Forwarded-Proto even when the final hop to this origin is HTTP. Keep the
# local scheme as a safe fallback. Production must restrict direct origin
# access to the trusted proxy before relying on this header.
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    "https" https;
}

# HSTS is meaningful only for requests that arrived at the trusted edge over
# HTTPS. An empty value is not emitted by nginx, so local/plain HTTP responses
# never advertise HSTS accidentally.
map $upstream_forwarded_proto $strict_transport_security {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

# Do not expose the origin for arbitrary Host headers. Cloudflare preserves the
# original public Host, so legitimate traffic is handled by the named server.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Keep a single public origin for SEO and cookies. This also collapses both
# http://www and https://www-at-the-edge to the canonical HTTPS apex URL.
server {
    listen 80;
    server_name www.mudaroba.com;
    if ($trusted_origin_peer = 0) {
        return 444;
    }
    add_header Strict-Transport-Security $strict_transport_security always;
    return 308 https://mudaroba.com$request_uri;
}

server {
    listen 80;
    server_name mudaroba.com;

    if ($trusted_origin_peer = 0) {
        return 444;
    }

    client_max_body_size 100M;

    # Cloudflare forwards the browser scheme in X-Forwarded-Proto. Redirect
    # plain HTTP at the edge while still allowing the HTTPS edge -> HTTP origin
    # hop. Direct origin access must additionally be restricted at the firewall.
    if ($upstream_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    # Baseline browser hardening. CSP needs a nonce-based rollout because the
    # current Next.js/analytics integration still emits controlled inline code.
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), usb=()" always;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Медиа из proxy-media с кэшем на диске nginx (^~ — приоритет над regex-локацией /api)
    location ^~ /api/catalog/proxy-media {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

        proxy_cache proxy_media;
        proxy_cache_key "$uri$is_args$args|$accept_webp";
        proxy_cache_valid 200 30d;
        # Django вешает Set-Cookie (sessionid) и Vary: Cookie даже на картинки —
        # это выключает общий кэш. Vary игнорируем (webp-вариативность уже в ключе
        # через $accept_webp), Set-Cookie прячем, чтобы кэш не раздавал чужую сессию.
        # X-Accel-Buffering: no от Django отключал буферизацию — без неё nginx
        # не кэширует; буферизация не ломает стриминг (клиент получает поток сразу).
        proxy_ignore_headers Set-Cookie Vary X-Accel-Buffering;
        proxy_hide_header Set-Cookie;
        # Мимо кэша: не-картинки (видео) и Range-запросы (стриминг)
        proxy_cache_bypass $proxy_media_skip_cache $http_range;
        proxy_no_cache $proxy_media_skip_cache $http_range;
        # Any add_header at location scope replaces inherited add_header values.
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), usb=()" always;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_read_timeout 180s;
    }

    # Медиафайлы Django — напрямую в бэкенд (раньше шли двойным прокси через Next)
    location /media/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        expires 30d;
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), usb=()" always;
        add_header Cache-Control "public, no-transform";
    }

    # Backend API and Admin
    location ~ ^/(admin|api|swagger|redoc) {
        # If accessing /admin, /api etc without trailing slash, it might 404 if APPEND_SLASH is False
        # But we want to let Django handle the internal paths.
        # Specifically for admin, let's ensure it works.
        rewrite ^/admin$ /admin/ permanent;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Django Static Files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Strict-Transport-Security $strict_transport_security always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), usb=()" always;
        add_header Cache-Control "public, no-transform";
    }

    # Дефолтная локаль (ru) живёт без префикса; Next отдаёт /ru/* как 200-дубликат
    # той же страницы — дубли попадали в индекс. Склеиваем 301-ом на URL без префикса.
    # Внутри Next это не решается: i18n-нормализация срезает префикс до middleware/redirects.
    # Абсолютный https (за Cloudflare $scheme=http — иначе Location уходил на http://).
    location = /ru {
        return 301 https://$host/$is_args$args;
    }
    location ^~ /ru/ {
        rewrite ^/ru/(.*)$ https://$host/$1 permanent;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

        # Next.js specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Sitemap needs extra time (SSR fetches many API endpoints)
    location = /sitemap.xml {
        proxy_pass http://frontend_upstream;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
