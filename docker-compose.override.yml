services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
      - /app/*/__pycache__
    environment:
      USE_RUNSERVER: 1

  frontend:
    build:
      target: development
    command: npm run dev
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Dev-сборка контейнера не должна делить .next с хостом: локальный
      # `npm run build` очищает каталог и ломает уже запущенный Next dev server.
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

  celeryworker:
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
      - /app/*/__pycache__

  celery_ai:
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
      - /app/*/__pycache__

  celery_recsys:
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
      - /app/*/__pycache__

  celerybeat:
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
      - /app/*/__pycache__
