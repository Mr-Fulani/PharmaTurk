name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (checks, migrations, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15.18-alpine3.24
        env:
          POSTGRES_USER: pharmaturk
          POSTGRES_PASSWORD: ci-only-postgres-secret-2026
          POSTGRES_DB: pharmaturk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmaturk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.10-alpine3.21
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pharmaturk:ci-only-postgres-secret-2026@localhost:5432/pharmaturk
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND_URL: redis://localhost:6379/2
      DJANGO_SECRET_KEY: ci-check-key-8c145d7758e14af4aa45143a255122682cd3618f5fe445da85815355027a327e
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poetry
        run: pipx install poetry==2.4.1
      - name: Validate dependency lock
        run: poetry check --lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - name: System deps (weasyprint)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0
      - run: poetry install --no-interaction --no-root
      - name: Validate installed dependencies
        run: poetry run python -m pip check
      - name: Audit Python runtime dependencies
        # Upstream has not published a fixed WeasyPrint release yet. Receipt
        # rendering is self-contained and rejects every external resource;
        # keep this single, documented exception until the advisory is fixed.
        run: >-
          pipx run --spec pip-audit==2.9.0 pip-audit
          --path "$(poetry env info --path)/lib/python3.12/site-packages"
          --ignore-vuln PYSEC-2026-3412
      - name: Django checks
        run: poetry run python manage.py check
      - name: Django deployment security checks
        env:
          SECURE_SSL_REDIRECT: '1'
          SECURE_HSTS_SECONDS: '31536000'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: '1'
          SECURE_HSTS_PRELOAD: '1'
        run: poetry run python manage.py check --deploy --tag security --fail-level ERROR
      - name: Check migration drift
        run: poetry run python manage.py makemigrations --check --dry-run
      # На 2026-06 кодовая база не проходит flake8 (~73k замечаний) — линт пока
      # информационный. Ужесточить после чистки (отдельная задача из роадмапа).
      - name: flake8 (informational)
        run: poetry run flake8 --count
        continue-on-error: true
      # ci-known-failures.txt — реестр известных падений, исключаемых из гейта.
      # Бейзлайн 2026-06-13: пуст (все 24 протухших теста починены).
      # Использовать только как временный карантин с задачей на починку.
      - name: pytest
        run: |
          DESELECT=$(sed 's/^/--deselect /' ci-known-failures.txt | tr '\n' ' ')
          poetry run pytest -q $DESELECT

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret configuration
        run: cp .env.example .env
      - name: Validate development configuration
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet
      - name: Validate production configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Validate isolated smoke configuration
        run: docker compose -f docker-compose.yml -f docker-compose.smoke.yml config --quiet
      - name: Validate isolated test configuration
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
      - name: Validate release scripts
        run: bash -n scripts/release/*.sh
      - name: Validate immutable application image contract
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --images > /tmp/images.txt
          grep -Fx "mudaroba-backend:${GITHUB_SHA}" /tmp/images.txt
          grep -Fx "mudaroba-frontend:${GITHUB_SHA}" /tmp/images.txt

  images:
    name: Production images (exact revision)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [secrets, frontend, backend, compose]
    env:
      IMAGE_TAG: ${{ github.sha }}
      DEPENDENCY_LOCK_HASH: ${{ hashFiles('backend/pyproject.toml', 'backend/poetry.lock') }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret build configuration
        run: cp .env.example .env
      - name: Build exact production images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend frontend
      - name: Verify immutable revision labels and runtime users
        run: |
          test "$(docker image inspect "mudaroba-backend:${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          test "$(docker image inspect "mudaroba-frontend:${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          test "$(docker image inspect "mudaroba-backend:${GITHUB_SHA}" --format '{{ .Config.User }}')" = "app"
          test "$(docker image inspect "mudaroba-frontend:${GITHUB_SHA}" --format '{{ .Config.User }}')" = "node"
