# Docker's default json-file driver keeps container logs forever; cap each
# service at 3 x 50 MB. Applies when a container is (re)created.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  backend:
    restart: always
    logging: *default-logging
    environment:
      USE_RUNSERVER: 0
      # Воркер gunicorn уходит на перезапуск после N запросов. При 200 оба
      # воркера перезапускались каждые ~5 мин, часто одновременно, и запросы
      # из очереди получали 502 (2026-10-19). 2000 ± 500 — примерно раз в час
      # и вразнобой.
      GUNICORN_MAX_REQUESTS: 2000
      GUNICORN_MAX_REQUESTS_JITTER: 500
    volumes:
      - staticfiles:/app/staticfiles
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      target: production
    command: npm run start
    restart: always
    # Лимит только для production-сборки: dev-сервер Next (override) прожорливее.
    mem_limit: 320m
    logging: *default-logging
    # Remove direct port 80 mapping, let Nginx handle it
    environment:
      - NODE_ENV=production
      # У контейнера нет IPv6-маршрута, а у cdn.mudaroba.com есть AAAA-записи:
      # без ipv4first оптимизатор next/image зависает на IPv6 (UND_ERR_CONNECT_TIMEOUT)
      - NODE_OPTIONS=--dns-result-order=ipv4first
    dns:
      - 8.8.8.8
      - 1.1.1.1

  nginx:
    restart: always
    logging: *default-logging
    # IPv4 only: on [::] Docker publishes through docker-proxy, nginx then sees
    # the bridge gateway (172.x, "trusted") instead of the client and the
    # Cloudflare-only gate in cloudflare-realip.inc is bypassed. Cloudflare
    # reaches the origin over IPv4 (A record).
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-realip.inc:/etc/nginx/cloudflare-realip.inc:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - staticfiles:/app/staticfiles:ro

  postgres:
    restart: always
    logging: *default-logging

  redis:
    restart: always
    logging: *default-logging

  redis-cache:
    restart: always
    logging: *default-logging

  qdrant:
    restart: always
    logging: *default-logging

  celeryworker:
    restart: always
    logging: *default-logging
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery_ai:
    restart: always
    logging: *default-logging
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery_recsys:
    restart: always
    logging: *default-logging
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celerybeat:
    restart: always
    logging: *default-logging
    dns:
      - 8.8.8.8
      - 1.1.1.1
